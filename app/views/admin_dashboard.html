<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админская панель</title>
</head>
<body>
    <h1>Добро пожаловать в админскую панель!</h1>
    <a href="/logout">Выйти</a>
    
    <h2>Список проектов</h2>
    <ul>
        {% for project in projects %}
            <li>
                <a href="{{ url_for('main.project', slug=project.slug) }}">{{ project.name }}</a>
                - <a href="{{ url_for('main.edit_project', project_id=project.id) }}">Редактировать</a>
            </li>
        {% endfor %}
    </ul>

    <a href="/admin/add_project">Добавить новый проект</a>
    
</body>
</html>
